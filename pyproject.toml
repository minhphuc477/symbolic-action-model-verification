[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ammr"
version = "0.2.0"
description = "Version-Space and Minimum-Edit Online Repair of Symbolic Action Models"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ammr*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "venv_linux",
    ".venv",
    "external",
    "FastLAS_repo",
    "locm_repo",
    "daineto-meta-planning",
    "papers",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["ammr", "experiments"]
