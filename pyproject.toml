[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ceg-omr-thesis"
version = "0.1.0"
description = "Counterexample-Guided Online Model Repair (CEG-OMR) for Game World Models"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
