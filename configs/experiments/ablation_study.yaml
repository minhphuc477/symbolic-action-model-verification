# Experiment Configuration: Ablation Study
# Evaluates the algorithmic necessity of:
#   1. Offline Backtracking (enable_backtracking)
#   2. STRIPS Effect Coherence Ranking (use_effect_coherence)

experiment_name: "ablation_study"
description: "Ablation of Backtracking and STRIPS Effect Coherence across critical domains"

output_dir: "benchmark_outputs"
output_file: "benchmark_outputs/ablation_study_results.json"

tasks:
  - domain: "Logistics"
    domain_gt: "domains/logistics/domain.pddl"
    problem: "domains/logistics/problem_p01.pddl"
    target_faults:
      - ["drive-truck", "(in-city ?to ?c)"]
      - ["load-truck", "(at ?t ?l)"]

  - domain: "Blocksworld"
    domain_gt: "domains/blocksworld/domain.pddl"
    problem: "domains/blocksworld/problem_p01.pddl"
    target_faults:
      - ["pick-up", "(handempty)"]
      - ["stack", "(clear ?y)"]

  - domain: "Gripper"
    domain_gt: "domains/gripper/domain.pddl"
    problem: "domains/gripper/problem_p01.pddl"
    target_faults:
      - ["pick", "(free ?gripper)"]
      - ["drop", "(carry ?obj ?gripper)"]

ablations:
  - id: "full_ceg_omr"
    name: "Full CEG-OMR (Proposed)"
    enable_backtracking: true
    use_effect_coherence: true

  - id: "no_backtracking"
    name: "Ablation A: No Backtracking"
    enable_backtracking: false
    use_effect_coherence: true

  - id: "no_effect_coherence"
    name: "Ablation B: No Effect Coherence (Uniform Random Selection)"
    enable_backtracking: true
    use_effect_coherence: false
