# Partial Observability Sensitivity Configuration
# Evaluates CEG-OMR robustness when state observations at execution failure are masked
experiment: partial_observability

domains:
  - name: pitch_black
    domain_path: domains/pitch_black/domain.pddl
    problem_path: domains/pitch_black/problem_p02.pddl
    search_str: "(is-light-on ?to)"
    replace_str: ""
  - name: dungeon_escape
    domain_path: domains/dungeon_escape/domain.pddl
    problem_path: domains/dungeon_escape/problem_p01.pddl
    search_str: "(has-key ?p ?k)\n      (door-locked ?door)"
    replace_str: "(door-locked ?door)"
  - name: blocksworld
    domain_path: domains/blocksworld/domain.pddl
    problem_path: domains/blocksworld/problem_p01.pddl
    search_str: "(clear ?x)\n    )"
    replace_str: ")"

observability_levels:
  - 1.0
  - 0.8
  - 0.6

seed: 42
max_repair_iterations: 30
enable_backtracking: true
use_effect_coherence: true
output_path: benchmark_outputs/partial_observability_results.json
