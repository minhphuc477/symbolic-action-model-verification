# Experiment Configuration: Bidirectional and Compound Action Model Repair Benchmark
# Benchmark comparing CEG-OMR against baselines across 24 scenarios x 3 seeds = 72 runs

experiment_name: "bidirectional_repair_benchmark"
description: "Evaluates CEG-OMR vs Monotonic-OLAM, Active SAM, and Passive SAM (M=250)"

suite_config: "configs/interventions/bidirectional_suite.yaml"
output_dir: "benchmark_outputs"
output_file: "benchmark_outputs/bidirectional_and_compound_repair_benchmark.json"

seeds: [42, 123, 999]

methods:
  - id: "ceg_omr_bidirectional"
    name: "CEG-OMR (Proposed: Bidirectional + Effect Coherence + Backtracking)"
    enable_backtracking: true
    use_effect_coherence: true
    bidirectional: true
    env_step_budget: 100
    plan_step_budget: 30

  - id: "monotonic_olam_style"
    name: "Monotonic-Only CEG-OMR (OLAM-style Precondition-Only Monotonic Refinement)"
    enable_backtracking: false
    use_effect_coherence: false
    bidirectional: false
    env_step_budget: 100
    plan_step_budget: 30

  - id: "active_sam"
    name: "Active SAM (Goal-Directed Safe Action Model Learning)"
    mode: "active"
    env_step_budget: 100
    plan_step_budget: 30

  - id: "passive_sam_250"
    name: "Passive SAM (M = 250 Exploratory Steps)"
    mode: "passive"
    passive_budget: 250
