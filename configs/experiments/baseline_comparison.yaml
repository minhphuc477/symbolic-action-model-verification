# Experiment Configuration: Classical Offline Learners Baseline Comparison
# Compares CEG-OMR against FAMA (SAT compilation), LOCM2 (FSM induction), and FastLAS (ASP abduction)

experiment_name: "baseline_comparison"
description: "Empirical benchmarking of offline learners (FAMA, LOCM2, FastLAS) vs CEG-OMR"

output_dir: "benchmark_outputs"
output_file: "benchmark_outputs/baseline_comparison_results.json"

domains:
  - name: "blocks"
    traces: [1, 5, 10]
  - name: "gripper"
    traces: [1, 5]

learners:
  fama:
    enabled: true
    timeout_seconds: 180
  locm2:
    enabled: true
    repo_path: "locm_repo"
  fastlas:
    enabled: true
    input_file: "domains/fastlas/test_fastlas.las"
