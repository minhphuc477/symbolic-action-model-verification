project:
  name: "Benchmarking Search-Tree Topology Collapse & Goal-Directed Active Model Repair"
  lead: "MSc Candidate & AI Research Agent"
  status: "active"
  current_phase: "theoretical_foundations_and_clean_codebase_locked"
  selected_track: "Search-Tree Topology Collapse under AST Rule Interventions & Goal-Directed A* CEGIS"

research_question:
  primary: "How do AST rule interventions induce search-tree topology collapse in learned symbolic action models, and how can Goal-Directed A* CEGIS repair models with polynomial sample complexity?"
  sub_questions:
    - "RQ1.1: How does minimal AST edit distance Delta DSL degrade schema reconstruction accuracy across LOCM2, FAMA, and FastLAS?"
    - "RQ1.2: Under what AST rule intervention types does high passive accuracy (A_pred >= 95%) induce 100% Play Regret (R_play = infinity) graph search collapse?"
    - "RQ1.3: Which non-LLM symbolic learner exhibits superior topological resilience across the 5 canonical rule intervention types?"
    - "RQ2.1: How can CEGIS be constrained to the A* search fringe to guarantee goal-directed active model repair?"
    - "RQ2.2: What is the exact PAC sample complexity bound K_CEGIS for active model repair under k-sparse AST rule modifications?"

hypotheses:
  - id: "H1.1"
    statement: "Passive schema accuracy degrades linearly with Delta DSL, maintaining >90% match for Delta DSL <= 2."
    status: "untested"
    priority: "high"

  - id: "H1.2"
    statement: "Type II (Latent Counter) and Type IV (Non-Local Coupling) interventions cause step-function collapse to R_play = infinity even when A_pred > 98% due to state merging in FSMs."
    status: "untested"
    priority: "high"

  - id: "H1.3"
    statement: "FastLAS (ASP ILP) exhibits superior topological resilience for Type III (Disjunctive) rules due to non-monotonic logic, but suffers combinatorial timeout on Type IV rules where FAMA converges faster."
    status: "untested"
    priority: "high"

  - id: "H2.1"
    statement: "Fringe-constrained A* CEGIS eliminates uninformative state probing, reducing active repair episodes by >= 75% compared to unconstrained exploration."
    status: "untested"
    priority: "high"

  - id: "H2.2"
    statement: "Goal-directed A* CEGIS bounds active repair sample complexity to polynomial K_CEGIS <= O(k * d * log n) under k-sparse AST edits."
    status: "untested"
    priority: "high"

metrics:
  primary_metrics:
    - "Search-Tree Edge Symmetric Distance (d_delta)"
    - "Play Regret (R_play)"
  secondary_metrics:
    - "Transition Accuracy (A_pred)"
    - "Critical Precondition Recall (CPR)"
    - "Phantom Edge Rate (PER)"
    - "Active CEGIS Query Complexity (K_CEGIS)"

two_paper_target:
  paper_1:
    title: "Benchmarking Search-Tree Topology Collapse in Lightweight Symbolic Action Models under Rule Interventions"
    target_venue: "IEEE Transactions on Games / ACM FDG"
    target_month: "Month 7"
    theory_foundation: "Proposition 1 (Search-Tree Phantom Path Divergence: d_delta = Omega(b^(D-d)) + Min-Cut + Causal Bisimulation Metric)"
  paper_2:
    title: "Goal-Directed Counterexample-Guided Active Synthesis for Repairing Symbolic World Models under Sparse Rule Modifications"
    target_venue: "Artificial Intelligence Journal (AIJ) / AAAI / ICAPS / ICLR"
    target_month: "Month 15"
    theory_foundation: "Theorem 1 (Angluin L* & Horn Clause RTD Active Repair Sample Complexity K_CEGIS <= O(k * d * log n) + Galois Connections)"
