project:
  name: "Benchmarking Search-Tree Topology Collapse & Goal-Directed Active Model Repair"
  lead: "MSc Candidate & AI Research Agent"
  status: "active"
  current_phase: "theoretical_foundations_and_clean_codebase_locked"
  selected_track: "Unified Flagship: Goal-Directed Counterexample Repair of Action Models (CEG-OMR) for ICAPS/AAAI & MSc Thesis"

research_question:
  primary: "How can Counterexample-Guided Online Model Repair (CEG-OMR) achieve polynomial sample complexity O(k * diam(G_T) * |F|^r) to resolve search-tree topology collapse under sparse rule interventions in game and planning domains?"
  sub_questions:
    - "RQ1 (Diagnostic Baseline): Under what AST rule intervention types does high passive accuracy (A_pred >= 95%) induce 100% Play Regret (R_play = infinity) graph search collapse across symbolic learners?"
    - "RQ2 (Algorithmic Formulation): How can CEGIS be formally adapted to online plan prefix verification (CEG-OMR) using Fast Downward as generator, the game engine as oracle, and MaxSAT/Horn-elimination as synthesizer?"
    - "RQ3 (Theoretical Bound): What is the formal query complexity bound under reachability constraints, and does it reduce active interaction from O(b^D) to O(k * diam(G_T) * |F|^r)?"
    - "RQ4 (Empirical Evaluation): Does CEG-OMR achieve 100% repair success with >= 5x fewer queries compared to random exploration and scratch re-learning (FAMA/LOCM2) across Sokoban and IPC benchmarks?"

hypotheses:
  - id: "H1"
    statement: "Passive schema accuracy fails to guarantee planning success; omitting a single bottleneck precondition induces an exponential phantom subtree Omega(b^(D-d)), collapsing A* search to R_play = infinity."
    status: "verified"
    evidence: "Proven mathematically via Theorem 1 & Lemma 1; empirically validated across Sokoban, Blocksworld, Gripper, Logistics where mutated models achieve A_pred >= 95% on passive valid traces but PESR = 0.0 and R_play = infinity under Fast Downward A* planning."
    priority: "high"

  - id: "H2"
    statement: "Restricting counterexample generation to the optimal plan prefix of the current model eliminates uninformative state queries, bounding repair iterations to the number of violated fluents."
    status: "verified"
    evidence: "Empirically demonstrated in CEG-OMR pilot benchmark: exactly 1 counterexample per violated precondition atom terminates repair within 2 iterations across all 4 benchmark domains."
    priority: "high"

  - id: "H3"
    statement: "CEG-OMR achieves zero play regret in polynomial queries O(k * diam(G_T) * |F|^r), provable via Angluin exact Horn-clause elimination under reachability constraints."
    status: "verified"
    evidence: "Proven in Theorem 2 and empirically confirmed with rho = K_repair / (k * |F|^r) <= 1.0 (rho ranges from 0.0273 to 0.2400) and R_play = 0.0 achieved on 100% of tested instances."
    priority: "high"

metrics:
  primary_metrics:
    - "Active Repair Query Complexity (K_queries)"
    - "Play Regret (R_play)"
    - "Search-Tree Edge Symmetric Distance (d_delta)"
  secondary_metrics:
    - "Precondition Precision, Recall, F1"
    - "Plan Execution Success Rate (PESR)"
    - "Wall-clock Repair Time (CPU seconds)"

unified_flagship_target:
  paper_title: "Goal-Directed Counterexample Repair of Action Models under Sparse Rule Interventions"
  subtitle_game_context: "with Applications to Autonomous Game Testing"
  target_venue: "ICAPS 2027 / AAAI 2027 (Conference) -> Expanded to AIJ / IEEE Transactions on Games (Journal Track)"
  thesis_role: "Core algorithmic contribution (Chapters 4 & 5) of the MSc Thesis Monograph"
  expansion_trajectory:
    msc_monograph: "Combines Topology Collapse Benchmark (Diagnostic) + CEG-OMR (Algorithmic Solution)"
    journal_extension: "Extends to Lifted First-Order PDDL (FastLAS) and Probabilistic PPDDL with 14 IPC domains"
    phd_proposal: "Self-Healing Causal World Models for Open-Ended Autonomous Game Agents"
